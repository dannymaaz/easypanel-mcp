name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example: v2.0.0)"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - "release/publish-*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve release inputs
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          PACKAGE_VERSION=$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$INPUT_TAG"
            PRERELEASE="$INPUT_PRERELEASE"
          else
            RELEASE_TAG="v${PACKAGE_VERSION}"
            PRERELEASE="false"
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Validate requested tag
        run: |
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Requested tag '$RELEASE_TAG' does not match pyproject.toml version '$EXPECTED_TAG'."
            exit 1
          fi

      - name: Install project and release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src config.py

      - name: Build documentation
        run: mkdocs build --strict

      - name: Build distribution
        run: python -m build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            release create "$RELEASE_TAG"
            dist/*
            --target main
            --title "EasyPanel MCP $RELEASE_TAG"
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
